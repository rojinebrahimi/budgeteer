name: Release

# Push a tag like v0.1.0 to publish binaries. The Claude Code plugin's
# launcher (bin/budgeteer-run) downloads these assets and verifies them
# against checksums.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Tag must match the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$tag" != "$plugin" ]; then
            echo "::error::tag v$tag does not match .claude-plugin/plugin.json version $plugin"
            exit 1
          fi
      - name: Test
        run: go test ./... -race -count=1
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
